<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" aria-label="Hero background">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a24"/>
      <stop offset="50%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="flare-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4a24a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#d4a24a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#d4a24a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="flare-glow" cx="0.7" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#d4a24a" stop-opacity="0.4"/>
      <stop offset="40%" stop-color="#d4a24a" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#d4a24a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#flare-glow)"/>

  <!-- Curved horizon lines (rapids) -->
  <g opacity="0.5">
    <path d="M0 800 Q480 720 960 780 T1920 760" stroke="url(#flare-grad)" stroke-width="2" fill="none"/>
    <path d="M0 860 Q480 780 960 840 T1920 820" stroke="url(#flare-grad)" stroke-width="1.5" fill="none" opacity="0.7"/>
    <path d="M0 920 Q480 840 960 900 T1920 880" stroke="url(#flare-grad)" stroke-width="1" fill="none" opacity="0.5"/>
    <path d="M0 980 Q480 900 960 960 T1920 940" stroke="url(#flare-grad)" stroke-width="0.8" fill="none" opacity="0.3"/>
  </g>

  <!-- Floating orbs -->
  <g opacity="0.6">
    <circle cx="280" cy="220" r="3" fill="#d4a24a"/>
    <circle cx="1500" cy="380" r="4" fill="#5ccfe6"/>
    <circle cx="1700" cy="180" r="2" fill="#d4a24a"/>
    <circle cx="600" cy="160" r="2" fill="#5ccfe6"/>
    <circle cx="1200" cy="500" r="2" fill="#d4a24a"/>
  </g>

  <!-- Light streaks -->
  <g opacity="0.4">
    <line x1="0" y1="120" x2="1920" y2="120" stroke="rgba(212,162,74,0.15)" stroke-width="1"/>
    <line x1="0" y1="600" x2="1920" y2="600" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  </g>

  <!-- Big flare shape -->
  <g transform="translate(1340 280)" opacity="0.85">
    <path d="M0 -80 L36 -24 L20 -20 L40 36 L0 16 L-40 36 L-20 -20 L-36 -24 Z"
          fill="url(#flare-grad)" stroke="#d4a24a" stroke-width="1"/>
  </g>
</svg>
